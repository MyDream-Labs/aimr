appId: site.aimr.app
productName: AIMR
artifactName: ${productName}-${os}-${arch}.${ext}
copyright: Copyright © 2026 MyDream Labs LLC
electronDist: ../../node_modules/electron/dist
electronVersion: 44.9.1
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/icons/512x512.png
  - resources/AIMRSplash.svg
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE.md
    to: NOTICE.md
  - from: ../../node_modules/@openai/codex-sdk/LICENSE
    to: licenses/codex-sdk-LICENSE

win:
  icon: resources/icon.ico
  target:
    - nsis
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  protocols:
    - name: theia
      schemes:
        - aimr
  darkModeSupport: true
  target:
    - dmg
    - zip
linux:
  executableName: aimr
  executableArgs: ["--ozone-platform=x11"]
  syncDesktopName: true
  icon: resources/icons
  category: Development
  mimeTypes:
    - inode/directory
  vendor: MyDream Labs LLC
  maintainer: MyDream Labs LLC <support@distill.codes>
  target:
    - deb
    - AppImage

nsis:
  menuCategory: true
  oneClick: false
  perMachine: false
  installerHeaderIcon: resources/icon.ico
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  uninstallerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: ${productName}-${os}-${arch}-Setup.${ext}
  license: LICENSE
dmg:
  artifactName: ${productName}-${os}-${arch}.${ext}
deb:
  packageName: aimr
  artifactName: ${productName}-${os}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${os}-${arch}.${ext}

afterPack: ./scripts/after-pack.js
