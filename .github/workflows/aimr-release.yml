name: AIMR Linux release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: aimr-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: clang-15
      CXX: clang++-15
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify version tag
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./applications/electron/package.json').version")"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile --network-timeout 100000
      - name: Build and test
        run: |
          corepack yarn build:extensions
          corepack yarn workspace aimr-product-ext lint
          corepack yarn workspace aimr-product-ext test
          corepack yarn download:plugins
          corepack yarn electron build:prod
          corepack yarn electron package --linux --x64
      - name: Smoke-test packaged application outside the checkout
        shell: bash
        run: |
          binary=$(find "$GITHUB_WORKSPACE/applications/electron/dist" -maxdepth 1 -name 'AIMR-*.AppImage')
          profile=$(mktemp -d)
          mkdir "$profile/workspace"
          export THEIA_CONFIG_DIR="$profile/config"
          export XDG_DATA_HOME="$profile/share"
          export XDG_CONFIG_HOME="$profile/xdg-config"
          cd "$RUNNER_TEMP"
          xvfb-run -a bash -euo pipefail -c '
            setsid "$1" --appimage-extract-and-run "$2/workspace" --electronUserData="$2/electron" --ozone-platform=x11 --remote-debugging-port=9222 > "$2/startup.log" 2>&1 &
            pid=$!
            trap "kill -- -$pid 2>/dev/null || true" EXIT
            for attempt in {1..90}; do
              if grep -q "application state.*ready" "$2/startup.log" &&
                 find "$XDG_DATA_HOME/applications" -name "*.desktop" -type f 2>/dev/null | grep -q .; then
                test ! -e "$THEIA_CONFIG_DIR/globalStorage/theia-ide-launcher/paths.json"
                AIMR_DESKTOP_ENTRY="$XDG_DATA_HOME/applications/site.aimr.app-launcher.desktop" \
                AIMR_BROWSER_DEBUG_URL=http://127.0.0.1:9222 AIMR_MCP_FIRST_RUN=1 \
                  corepack yarn --cwd "$GITHUB_WORKSPACE" workspace aimr-product-ext test:live
                exit 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "$2/startup.log"
            exit 1
          ' _ "$binary" "$profile"
      - name: Checksums
        working-directory: applications/electron/dist
        run: sha256sum AIMR-*.AppImage AIMR-*.deb > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aimr-linux-x64
          if-no-files-found: error
          path: |
            applications/electron/dist/AIMR-*.AppImage
            applications/electron/dist/AIMR-*.deb
            applications/electron/dist/SHA256SUMS

  preview:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aimr-linux-x64
          path: release
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./applications/electron/package.json').version")
          title="AIMR Preview — $version"
          notes="Linux x64 preview. Version: $version. Source: $GITHUB_SHA. Requires Codex CLI on PATH and an existing Codex login. IDE control supports one MCP client at a time. Automatic updates are not enabled."
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview release/* --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit preview --draft=false --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create preview release/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes "$notes"
          fi
